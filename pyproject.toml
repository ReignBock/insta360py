[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta360py"
version = "0.1.0"
description = "Python implementation of insvtools and Insv-Marker-Extractor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.25",         # INFO frame (type 1) parse/serialize + dump-meta JSON
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pylint>=3",
    "pylint-protobuf",        # teaches pylint the generated ExtraMetadata fields
    "pyright>=1.1.400",       # type checker; the engine behind VS Code's Pylance
    "grpcio-tools",           # optional: regenerate extra_metadata_pb2.py without Docker
]

[project.scripts]
insvtools = "insvtools.cli:main"
insv-markers = "insvmarkers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insvtools = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["insvtools", "insvmarkers"]
# Generated by protoc, like the pylint and pyright exclusions above.
omit = ["*/extra_metadata_pb2.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
# Everything else is covered; anything new should arrive with its tests.
fail_under = 100

[tool.pylint.main]
load-plugins = ["pylint_protobuf"]
# extra_metadata_pb2.py is generated by protoc; it is not ours to style-check.
# The pattern deliberately omits the ".py": pylint matches ignore-paths against
# the extensionless module path, so any pattern ending in "\.py" never matches.
ignore-paths = [".*extra_metadata_pb2"]

[tool.pylint.format]
max-line-length = 120


[tool.pylint.design]
# Binary format code legitimately carries wide helper signatures and a lot of
# small locals: sample tables have many parallel arrays.
max-args = 8
max-positional-arguments = 8
max-attributes = 10
max-locals = 25

[tool.pyright]
include = ["src", "tests", "tools"]
# Same engine as Pylance, so editor and CI agree. "standard" is Pylance's own
# default; the codebase is clean at that level.
typeCheckingMode = "standard"
# Generated by protoc, like the pylint ignore-paths above. The matching
# extra_metadata_pb2.pyi stub is still used to resolve ExtraMetadata.
ignore = ["**/extra_metadata_pb2.py"]
