[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta360py"
version = "0.1.0"
description = "Python implementation of insvtools and Insv-Marker-Extractor"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "protobuf>=4.25",         # INFO frame (type 1) parse/serialize + dump-meta JSON
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "grpcio-tools",           # optional: regenerate extra_metadata_pb2.py without Docker
]

[project.scripts]
insvtools = "insvtools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insvtools = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
