[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "insta360py"
version = "0.2.0"
description = "Read, cut and extract markers from Insta360 .insv/.lrv footage"
readme = "README.md"
# SPDX expression per PEP 639; the TOML-table form is deprecated. The vendored
# extra_metadata.proto and the code generated from it stay Apache-2.0, which
# the NOTICE-style credit in the README records.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "ReignBock" }]
keywords = ["insta360", "insv", "mp4", "metadata", "video", "markers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "protobuf>=4.25",         # INFO frame (type 1) parse/serialize + dump-meta JSON
]

[project.urls]
Homepage = "https://github.com/ReignBock/insta360py"
Source = "https://github.com/ReignBock/insta360py"
Issues = "https://github.com/ReignBock/insta360py/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pylint>=3",
    "pylint-protobuf",        # teaches pylint the generated ExtraMetadata fields
    "pyright>=1.1.400",       # type checker; the engine behind VS Code's Pylance
    "PySide6-Essentials>=6.7", # the window is tested headless; keep in step with the gui extra
]
# Only needed to regenerate the protobuf bindings, which are committed. Kept
# out of `dev` because it is a large download that no ordinary change needs.
proto = ["grpcio-tools"]
# The desktop window. PySide6-Essentials carries QtWidgets without the
# add-on modules the full PySide6 wheel bundles.
gui = ["PySide6-Essentials>=6.7"]

[project.scripts]
insvtools = "insvtools.cli:main"
insv-markers = "insvmarkers.cli:main"

[project.gui-scripts]
insv-markers-gui = "insvmarkers.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# py.typed marks both packages as typed (PEP 561); without it a consumer's
# type checker ignores the annotations and the generated .pyi stub entirely.
# The .pyi is listed rather than left to setuptools' implicit stub handling.
insvtools = ["*.proto", "*.pyi", "py.typed"]
insvmarkers = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["insvtools", "insvmarkers"]
# Generated by protoc, like the pylint and pyright exclusions above.
omit = ["*/extra_metadata_pb2.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
# Everything else is covered; anything new should arrive with its tests.
fail_under = 100

[tool.pylint.main]
load-plugins = ["pylint_protobuf"]
# extra_metadata_pb2.py is generated by protoc; it is not ours to style-check.
# The pattern deliberately omits the ".py": pylint matches ignore-paths against
# the extensionless module path, so any pattern ending in "\.py" never matches.
ignore-paths = [".*extra_metadata_pb2"]

[tool.pylint.format]
max-line-length = 120


[tool.pylint.design]
# Binary format code legitimately carries wide helper signatures and a lot of
# small locals: sample tables have many parallel arrays.
max-args = 8
max-positional-arguments = 8
max-attributes = 10
max-locals = 25

[tool.pyright]
include = ["src", "tests", "tools"]
# Same engine as Pylance, so editor and CI agree. "standard" is Pylance's own
# default; the codebase is clean at that level.
typeCheckingMode = "standard"
# Check against the oldest Python we claim to support, not the one that
# happens to be installed: syntax and stdlib added after 3.12 is an error
# here rather than a surprise on a user's machine.
pythonVersion = "3.12"
# Generated by protoc, like the pylint ignore-paths above. The matching
# extra_metadata_pb2.pyi stub is still used to resolve ExtraMetadata.
ignore = ["**/extra_metadata_pb2.py"]
