name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and attach to the GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # A tag that disagrees with pyproject.toml produces a wheel whose
      # filename and metadata contradict the release it hangs off. Catch it
      # before anything is built.
      - name: Check the tag matches the project version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG project version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match version $VERSION (expected v$VERSION)"
            exit 1
          fi

      # Optional: the two tests that need it skip cleanly without it.
      - name: Install ffmpeg (optional)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: pip install -e '.[dev]' build twine

      # Never ship something the suite has not passed.
      - name: Run the full suite
        run: pytest -q --cov

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the package metadata
        run: twine check --strict dist/*

      - name: Verify the built wheel runs
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/insvtools --version
          /tmp/wheel-check/bin/insv-markers --help > /dev/null

      # Creates the release if the tag was pushed without one, and is a no-op
      # if it already exists; --clobber keeps a re-run from failing on
      # artifacts that are already attached.
      - name: Publish the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
