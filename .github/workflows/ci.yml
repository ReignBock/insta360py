name: CI

on:
  push:
    # Tags are covered by the release workflow, which runs the same suite.
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch makes an in-flight run redundant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Two tests decode cut output to prove the container is really valid.
      # They skip without ffmpeg and the coverage gate still passes, so this
      # is worth having - but an apt hiccup is not a reason to fail a build.
      - name: Install ffmpeg (optional)
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The window's tests run on Qt's offscreen platform, which still loads
      # these. Required, unlike ffmpeg: without Qt the window's tests skip and
      # the coverage gate fails.
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgssapi-krb5-2

      - run: pip install -e '.[dev]'

      # Fails under 100% coverage; see fail_under in pyproject.toml. -rs
      # reports skip reasons so the check below can see them.
      - name: Run tests
        run: pytest -q --cov -rs | tee result.txt

      # Surfaced rather than enforced: the suite is still correct without
      # ffmpeg, but a run that quietly lost the container checks should say so
      # in the job summary instead of just reporting green.
      - name: Note whether the ffmpeg tests ran
        if: always()
        run: |
          if grep -q "ffmpeg not installed\|ffmpeg not available" result.txt; then
            echo "::warning::ffmpeg unavailable - the two cut-output decode checks were skipped"
            echo ":warning: ffmpeg unavailable, cut-output decode checks skipped" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":white_check_mark: ffmpeg present, cut-output decode checks ran" >> "$GITHUB_STEP_SUMMARY"
          fi

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - name: pylint
        run: pylint src tests tools

      # pyright is a Node program; the runner already has Node, so the pip
      # package finds it instead of downloading one.
      - name: pyright
        run: pyright

  package:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # Not because we upload to an index, but because it catches a README
      # that will not render and metadata that will not parse.
      - name: Check the package metadata
        run: twine check --strict dist/*

      # A wheel that imports but cannot run is not much use, and the console
      # scripts are the whole interface.
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/insvtools --version
          /tmp/wheel-check/bin/insv-markers --help > /dev/null

      # The test extra brings in Qt and cryptography, and Qt needs its runtime
      # libraries. Keep the apt line in step with the test job.
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgssapi-krb5-2

      # setuptools' default sdist omits conftest.py and the fixtures, which
      # leaves the tests unrunnable. MANIFEST.in fixes that, and this is what
      # keeps it fixed. It runs the whole suite, as a contributor would.
      - name: Run the test suite from the unpacked sdist
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          python -m venv /tmp/sdist-check
          /tmp/sdist-check/bin/pip install "/tmp/sdist[test]"
          cd /tmp/sdist && /tmp/sdist-check/bin/python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
