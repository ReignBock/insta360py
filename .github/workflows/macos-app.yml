name: macOS app

# Builds the standalone Insta360 Markers app, signs the zips with the release
# key, and, when given a release tag, attaches them to that release.
# release.yml calls this after it publishes: a release made with GITHUB_TOKEN
# does not start other workflows by itself, so a `release: published` trigger
# would never fire.
#
# The app's updater installs only zips signed by a certificate the release
# authority issued, so a release without one is refused. The authority's own
# certificate and the revocation list are in the repository, not secrets. The
# secrets are:
#   RELEASE_SIGNING_KEY   the release private key, as PEM text. The only secret.
# Its certificate is public and is tools/pki/release.crt, issued by
# tools/pki/issue-release-cert.sh.
#
# Run by hand from the Actions tab to try a build. Leave the tag empty and the
# zips stay on the run as artifacts, unsigned if the secrets are not set.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the apps to
        type: string
        required: true
    secrets:
      RELEASE_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the apps to. Empty builds without attaching."
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  app:
    name: Build for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    env:
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

    steps:
      # Checked first so a missing secret fails in seconds, not after a build.
      - name: Check the signing key
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              echo "::error::RELEASE_SIGNING_KEY must be set to publish a release"
              exit 1
            fi
            echo "::warning::the signing key is not set; this build is unsigned and cannot be installed as an update"
          fi

      - uses: actions/checkout@v7
        with:
          # An empty ref means the ref that started the run.
          ref: ${{ inputs.tag }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # build-app.sh builds the authority's certificate and the revocation list
      # into the app.
      - name: Build the app
        run: tools/build-app.sh

      # A build that produces a bundle which cannot start is worse than a
      # failed build. Qt's offscreen platform needs no display, so the runner
      # can prove the frozen app launches and stays up.
      - name: Check the app starts
        run: |
          APP="dist-app/Insta360 Markers.app/Contents/MacOS/Insta360 Markers"
          QT_QPA_PLATFORM=offscreen "$APP" tests/resources/x5_indexed.insv &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID" || true
            echo "::error::the app exited within 5 seconds"
            exit 1
          fi
          kill "$PID"

      # Runs the app's own check first: a wrong pairing, an expired or revoked
      # certificate fails here and not on a user's Mac.
      - name: Sign the zip
        if: env.RELEASE_SIGNING_KEY != ''
        run: uv run --no-dev --extra gui python tools/sign_release.py dist-app/*.zip

      # Independent proof, checkable with `gh attestation verify`, that GitHub
      # Actions built these zips from this repository.
      - name: Attest the build
        if: inputs.tag != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist-app/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Insta360-Markers-${{ matrix.arch }}
          path: |
            dist-app/*.zip
            dist-app/*.zip.sig
            dist-app/*.zip.crt

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The authority's certificate lets anyone check a download by hand
          # with tools/verify_release.py. Both architectures upload the same file.
          gh release upload "${{ inputs.tag }}" dist-app/*.zip dist-app/*.zip.sig dist-app/*.zip.crt \
            src/insvmarkers/release_ca.pem --clobber
